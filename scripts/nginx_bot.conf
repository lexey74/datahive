# Nginx site config for Data Hive Telegram bot + MCP SSE server
# Домен: datahive.inno.co
# Разместить в /etc/nginx/sites-available/datahive и создать symlink в sites-enabled

server {
    listen 80;
    server_name datahive.inno.co;

    # Let's Encrypt ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Редирект HTTP -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name datahive.inno.co;

    # SSL сертификаты (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/datahive.inno.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datahive.inno.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Таймауты для тяжёлых загрузок (видео, медиа)
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # --- MCP SSE сервер ---
    # SSE требует отключения буферизации и keepalive
    location /mcp {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Обязательно для SSE: отключаем буферизацию
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # --- Telegram Webhook ---
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Передаём секретный токен Telegram
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;

        proxy_set_header Connection "";
    }
}
