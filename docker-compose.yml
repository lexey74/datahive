# DataHive — docker-compose
# Два сервиса: bot, whisper.
# Ollama вынесена в отдельный проект /home/lexey/projects/ollama/
# TLS и публичный доступ — через общий Caddy (/home/lexey/projects/caddy/)
#
# Использование:
#   docker compose up -d
#
# Генерация API-ключей:
#   openssl rand -hex 32

services:

  # ── Telegram-бот ──────────────────────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datahive-bot
    restart: unless-stopped
    depends_on:
      whisper:
        condition: service_healthy
    env_file: .env
    environment:
      # Внутри Docker-сети — без TLS, с API-ключом
      WHISPER_URL: http://datahive-whisper:9000
      WHISPER_API_KEY: ${WHISPER_API_KEY}
      # Ollama — standalone контейнер в projects_net
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./users:/app/users
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./cookies:/app/cookies
      - ./known_tags.json:/app/known_tags.json
      - ./bot_state:/app/bot_state
    networks:
      - datahive_internal
      - datahive_external   # выход в интернет (api.telegram.org)
      - projects_net        # доступ к ollama

  whisper:
    build:
      context: ./services/whisper
      dockerfile: Dockerfile
    container_name: datahive-whisper
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
      WHISPER_LANGUAGE: ru
      API_KEY: ${WHISPER_API_KEY}
      IDLE_TIMEOUT_MINUTES: ${WHISPER_IDLE_TIMEOUT:-30}
      PRELOAD_MODEL: ${WHISPER_PRELOAD:-true}
    volumes:
      - whisper_models:/root/.cache/huggingface
    expose:
      - "9000"
    networks:
      - datahive_internal
      - projects_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  whisper_models:

networks:
  # Внутренняя сеть: bot ↔ whisper (без доступа снаружи)
  datahive_internal:
    driver: bridge
    internal: true
  # Сеть для выхода бота в интернет (api.telegram.org)
  datahive_external:
    driver: bridge
  # Общая сеть проектов — Caddy + ollama
  projects_net:
    external: true
