services:
  # ── 1. Telegram Bot ───────────────────────────────────────────
  bot:
    build: .
    container_name: datahive_bot
    command: python -m src.bot.main
    volumes: &app_volumes
      - ./users/${USER_NAME:-lexey}:/app/data/vault
      - ./temp:/app/data/temp
      - ./bot_state:/app/data/config
      - ./logs:/app/logs
      - ./auth.json:/app/auth.json
      - ./.env:/app/.env
      - ./src:/app/src
    env_file: .env
    environment: &app_env
      - DATA_DIR=/app/data
      - OUTPUT_DIR=/app/data/vault/downloads
      - TEMP_DIR=/app/data/temp
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    restart: unless-stopped
    depends_on:
      - nginx

  # ── 2. Nginx reverse-proxy ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: datahive_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./scripts/nginx_bot.conf:/etc/nginx/conf.d/datahive.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    restart: unless-stopped

  # ── 3. Certbot (SSL) ──────────────────────────────────────────
  # Запуск для получения/обновления сертификата:
  #   docker compose run --rm certbot
  certbot:
    image: certbot/certbot:latest
    container_name: datahive_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    command: >
      certonly --webroot
      --webroot-path=/var/www/certbot
      --email admin@datahive.inno.co
      --agree-tos
      --no-eff-email
      -d datahive.inno.co
    profiles:
      - certbot

volumes:
  certbot_www:
  certbot_conf:
