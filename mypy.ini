[mypy]
python_version = 3.12
files = src, scripts, tests, module2_transcribe.py, module3_analyze.py
plugins = pydantic.mypy
pretty = True
show_error_codes = True
ignore_missing_imports = True
follow_imports = silent
namespace_packages = True
explicit_package_bases = True
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
exclude = ^(venv/|\.git/|downloads/|users/|logs/|temp/|\.temp/|archive/)

[mypy-src.modules.youtube_grabber_v2]
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-src.modules.youtube_comment_service]
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-src.modules.safe_comments]
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disable_error_code = attr-defined
